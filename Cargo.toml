[workspace]
members = ["benchmarks",
    "z1",
    "z2",
    "z3",
    "z4",
]
resolver = "3"


[workspace.dependencies]
ndarray = "0.17.2"
criterion = "0.8.2"
ndarray-rand = "0.16.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
assert_float_eq = "1.2.0"
csv = "1.4.0"
ndarray-csv = "0.5.4"
serde = { version = "1.0.229", features = ["derive"] }
ndarray-linalg = { version = "0.18.1", features = ["openblas-static"] } 
openblas-src = { version = "0.10", features = ["native-tls"] }